name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release
      - name: Build spikes
        if: runner.os == 'Windows'
        run: cargo build --release --examples
      - name: Upload spikes
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: spikes
          path: |
            target/release/examples/spike_a.exe
            target/release/examples/spike_b.exe
