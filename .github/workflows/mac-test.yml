name: mac-test

# Publishes the Mac app and the two Mac test programs as a pre-release called "mac-test". It is a
# pre-release on purpose: the updaters read the latest normal release and must never see this one.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the app
        run: scripts/build-mac-app.sh

      - name: Build the test programs (Apple Silicon and Intel in one file each)
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          for p in mac_spike_a mac_spike_b; do
            cargo build --release --example $p --target aarch64-apple-darwin
            cargo build --release --example $p --target x86_64-apple-darwin
            lipo -create -output out/$p \
              target/aarch64-apple-darwin/release/examples/$p \
              target/x86_64-apple-darwin/release/examples/$p
            codesign --force --sign - out/$p
          done

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete mac-test --cleanup-tag --yes || true
          gh release create mac-test out/clip-a-pc-mac.zip out/mac_spike_a out/mac_spike_b \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Mac test build" \
            --notes-file MAC_TEST_NOTES.md
