name: mac-test

# Publishes the Mac test program as a pre-release called "mac-test". It is a pre-release on
# purpose: the Windows updater reads the latest normal release and must never see this one.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (Apple Silicon and Intel in one file)
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --example mac_spike_a --target aarch64-apple-darwin
          cargo build --release --example mac_spike_a --target x86_64-apple-darwin
          mkdir -p out
          lipo -create -output out/mac_spike_a \
            target/aarch64-apple-darwin/release/examples/mac_spike_a \
            target/x86_64-apple-darwin/release/examples/mac_spike_a
          codesign --force --sign - out/mac_spike_a

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete mac-test --cleanup-tag --yes || true
          gh release create mac-test out/mac_spike_a \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Mac test build" \
            --notes-file MAC_TEST_NOTES.md
