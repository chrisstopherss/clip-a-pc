name: release

# Run from the Actions tab (or by the maintainer's tooling). The release is named
# after the version in Cargo.toml, so bump that first.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: ver
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Stop if this version is already released
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "${{ steps.ver.outputs.tag }} already exists. Bump the version in Cargo.toml first."
            exit 1
          fi

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash target/release/clip-a-pc.exe -Algorithm SHA256).Hash.ToLower()
          "$h  clip-a-pc.exe" | Out-File -FilePath target/release/clip-a-pc.exe.sha256 -Encoding ascii -NoNewline

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            target/release/clip-a-pc.exe \
            target/release/clip-a-pc.exe.sha256 \
            --target "$GITHUB_SHA" \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md
